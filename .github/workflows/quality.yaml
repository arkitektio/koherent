name: Run Coverage

on:
  pull_request:
    branches: [main] # or any branches you want to target
  push:
    branches: [main]

jobs:
  run_tests:
    name: Python (Pull Request Tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Check Ruff
        run: uvx ruff check .

      # basedpyright against .basedpyright/baseline.json: the errors that existed
      # when it was introduced are recorded there, so this fails only on new ones.
      # Fix one, then refresh the baseline with `uv run basedpyright --writebaseline`.
      - name: Check types (basedpyright)
        run: uv run basedpyright
